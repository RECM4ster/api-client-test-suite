[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gorest-api-client-tests"
version = "0.1.0"
description = "Typed GoREST API client with unit and integration tests"
requires-python = ">=3.12"

dependencies = [
    "httpx",
    "pydantic[email]",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-mock",
    "respx",
    "ruff",
    "mypy",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.mypy]
strict = true
python_version = "3.12"